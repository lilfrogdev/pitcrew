packages:
  - apps/*
  - packages/*
allowBuilds:
  # Native binaries used by builds and the local Worker emulator.
  esbuild@0.28.1 || 0.28.2: true
  workerd@1.20261001.1: true
  # These transitive hooks are unnecessary for the installed runtime packages.
  "@google/genai": false
  core-js-pure: false
  protobufjs: false
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261003.1"
  - "@earendil-works/chord@1.0.1"
  - "@earendil-works/pi-ai@1.0.1"
  - "@earendil-works/pi-durable@1.0.1"
  - "@earendil-works/pi-telemetry@1.0.1"
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
peerDependencyRules:
  allowedVersions:
    vite: "*"
