<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Pitcrew agent orchestration</title>
  <desc id="desc">Crew workflow matching the Flow tab: User through RepositoryAgent, Planner, Approval, and Coordinator; Implementer to TestRunner; TestAgent through Reviewer to Result, with a bounded rework path back to Implementer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .node { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .label { font: 500 13px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 1.75; marker-end: url(#arrow); }
      .muted { stroke-dasharray: 5 4; }
      .caption { font: 400 11px ui-sans-serif, system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .title { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <text x="24" y="28" class="title">Use this crew and workflow</text>

  <rect class="node" x="520" y="48" width="110" height="40" rx="6"/>
  <text class="label" x="575" y="73">TestAgent</text>

  <rect class="node" x="670" y="48" width="110" height="40" rx="6"/>
  <text class="label" x="725" y="73">Reviewer</text>

  <rect class="node" x="820" y="48" width="80" height="40" rx="6"/>
  <text class="label" x="860" y="73">Result</text>

  <path class="edge" d="M630 68 H668"/>
  <path class="edge" d="M780 68 H818"/>

  <rect class="node" x="24" y="220" width="72" height="40" rx="6"/>
  <text class="label" x="60" y="245">User</text>

  <rect class="node" x="130" y="220" width="130" height="40" rx="6"/>
  <text class="label" x="195" y="245">RepositoryAgent</text>

  <rect class="node" x="294" y="220" width="88" height="40" rx="6"/>
  <text class="label" x="338" y="245">Planner</text>

  <rect class="node" x="416" y="220" width="88" height="40" rx="6"/>
  <text class="label" x="460" y="245">Approval</text>

  <rect class="node" x="538" y="220" width="110" height="40" rx="6"/>
  <text class="label" x="593" y="245">Coordinator</text>

  <path class="edge" d="M96 240 H128"/>
  <path class="edge" d="M260 240 H292"/>
  <path class="edge" d="M382 240 H414"/>
  <path class="edge" d="M504 240 H536"/>

  <rect class="node" x="690" y="180" width="110" height="40" rx="6"/>
  <text class="label" x="745" y="205">Implementer</text>

  <rect class="node" x="840" y="180" width="100" height="40" rx="6"/>
  <text class="label" x="890" y="205">TestRunner</text>

  <path class="edge" d="M648 240 H668 V200 H688"/>
  <path class="edge" d="M800 200 H838"/>

  <path class="edge muted" d="M725 88 V150 H745 V178"/>
  <text class="caption" x="800" y="138">bounded rework later</text>

  <path class="edge" d="M890 180 V28 H575 V46"/>

  <text class="caption" x="460" y="320">After Approval, Coordinator dispatches ChangeAgent. Checkout is local-executor or Artifacts+sandbox by EXECUTION_MODE.</text>
  <text class="caption" x="460" y="340">Flow tab replays the same crew roles from GET /api/threads/:id/trace.</text>
</svg>
